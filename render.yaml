services:
  - type: web
    name: pragyaai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_VERSION
        value: 1.2.0
      - key: DATA_DIR
        value: /tmp/pragyaai
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: ENABLE_MCP
        value: "false"
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: MCP_INTERNAL_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
